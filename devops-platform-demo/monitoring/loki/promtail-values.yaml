# Promtail Helm values — DaemonSet，收集所有 Pod 日志送往 Loki
# helm upgrade --install promtail grafana/promtail \
#   -f monitoring/loki/promtail-values.yaml -n monitoring

config:
  clients:
    - url: http://loki:3100/loki/api/v1/push
  snippets:
    pipelineStages:
      - cri: {}
      # 仪表盘按 container 标签（cypress / newman）过滤；
      # 不再从 Job 的 job-name 标签提取 job_name（该标签不稳定，见 issue #96）
      - match:
          selector: '{namespace=~"qa-portfolio.*"}'
          stages:
            - labeldrop:
                - filename

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 100m
    memory: 128Mi

tolerations:
  - key: node-role.kubernetes.io/master
    operator: Exists
    effect: NoSchedule
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule

serviceMonitor:
  enabled: true
  labels:
    release: prometheus
