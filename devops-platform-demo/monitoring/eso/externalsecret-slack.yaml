apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-slack
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: aws-secretsmanager
  target:
    name: alertmanager-slack
    creationPolicy: Owner
  data:
    - secretKey: url
      remoteRef:
        key: portfolio-dev/slack-webhook
        property: url
