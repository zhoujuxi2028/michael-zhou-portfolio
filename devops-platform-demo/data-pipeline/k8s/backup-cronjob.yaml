# 每日 02:00 UTC 备份（REQ-DVP-009 FR-01 / FR-02 / FR-04）
# 两个主容器经 /work 下 rc 文件交接；不用 initContainer：pg_dump 失败时仍需推送 status=0
#   dump   (postgres) backup.sh            pg_dump + manifest → dump.rc；等 upload.rc → 推指标
#   upload (aws-cli)  s3-backup.sh upload  等 dump.rc → 上传 + retention.sh → upload.rc
# 手动触发：kubectl --context k3d-portfolio-dev -n data-pipeline create job --from=cronjob/db-backup db-backup-manual-1
apiVersion: batch/v1
kind: CronJob
metadata:
  name: db-backup
  labels:
    app.kubernetes.io/name: db-backup
spec:
  schedule: "0 2 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 900
      template:
        metadata:
          labels:
            app.kubernetes.io/name: db-backup
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 70
            runAsGroup: 70
            fsGroup: 70
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: dump
              image: postgres:16-alpine
              command: ["bash", "/scripts/backup.sh"]
              envFrom:
                - configMapRef:
                    name: db-backup-config
              env:
                - name: PGHOST
                  value: postgres
                - name: PGUSER
                  valueFrom:
                    secretKeyRef:
                      name: pg-credentials
                      key: POSTGRES_USER
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: pg-credentials
                      key: POSTGRES_PASSWORD
                - name: PGDATABASE
                  valueFrom:
                    secretKeyRef:
                      name: pg-credentials
                      key: POSTGRES_DB
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: work
                  mountPath: /work
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
            - name: upload
              image: amazon/aws-cli
              command: ["bash", "/scripts/s3-backup.sh", "upload"]
              envFrom:
                - configMapRef:
                    name: db-backup-config
                - secretRef:
                    name: backup-s3-creds
              env:
                - name: HOME
                  value: /tmp
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: work
                  mountPath: /work
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: work
              emptyDir:
                sizeLimit: 1Gi
            - name: tmp
              emptyDir: {}
            - name: scripts
              configMap:
                name: db-backup-scripts
