# DB / S3 凭据：Secrets Manager → K8s Secret（REQ-DVP-009 D4）。源由 terraform/backup.tf 创建。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pg-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: aws-secretsmanager
  target:
    name: pg-credentials
    creationPolicy: Owner
  data:
    - secretKey: POSTGRES_USER
      remoteRef:
        key: portfolio-dev/postgres
        property: username
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: portfolio-dev/postgres
        property: password
    - secretKey: POSTGRES_DB
      remoteRef:
        key: portfolio-dev/postgres
        property: database
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backup-s3-creds
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: aws-secretsmanager
  target:
    name: backup-s3-creds
    creationPolicy: Owner
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: portfolio-dev/db-backup-s3
        property: access_key_id
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: portfolio-dev/db-backup-s3
        property: secret_access_key
