server:
  port: 18066 #服务端口
  servlet:
    context-path: /${spring.application.name}
spring:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      url: jdbc:mysql://localhost:3306/db_control_sys?useSSL=false&useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
      username: root
      password: 123456
      driverClassName: com.p6spy.engine.spy.P6SpyDriver
      #      connection-properties: config.decrypt=true;config.decrypt.key=${spring.datasource.druid.config.key}
      #      config:
      #        key: MFwwDQYJKoZIhvcNAQEBBQADSwAwSAJBAOn9FEENpOpokBuqurBseiwaeCNkKDVFMBaPtYxsHncRzmGmLDH+MpJWPBRrax4FzLUCqPmms6VbXfEquZKfUvkCAwEAAQ==

      #连接池配置
      initial-size: 5
      max-active: 100
      min-idle: 5
      max-wait: 60000
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20
      validation-query-timeout: 60000
      validation-query: SELECT 1 FROM DUAL
      test-on-borrow: false
      test-on-return: false
      test-while-idle: true
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 100000
      ###监控配置 begin###
      # WebStatFilter配置，说明请参考Druid Wiki，配置_配置WebStatFilter
      web-stat-filter:
        enabled: true
        url-pattern: /*
        exclusions: /druid/*,*.js,*.gif,*.jpg,*.png,*.css,*.ico
        # StatViewServlet配置，说明请参考Druid Wiki，配置_StatViewServlet配置
      stat-view-servlet:
        enabled: true
        url-pattern: /druid/*
        reset-enable: false
        login-username: admin
        login-password: admin
        allow: 127.0.0.1
      # 配置StatFilter
      filter:
        stat:
          db-type: mysql
          log-slow-sql: true
          slow-sql-millis: 5000
        # 配置WallFilter
        wall:
          enabled: false
          db-type: mysql
          config:
            delete-allow: false
            drop-table-allow: false
        config:
          enabled: true
  servlet:
    multipart:
      enabled: true
      max-file-size: 500MB
      max-request-size: 500MB
      resolve-lazily: true
  redis:
    #数据库索引
    database: 0
    host: 172.25.21.3
    port: 6370
    password: 'fansYun@.cn'
    #连接超时时间
    timeout: 10000
    lettuce:
      pool:
        max-active: 20
        max-wait: 10000
        max-idle: 10
        min-idle: 10
eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:17070/eureka/
    #表示是否需要将自己注册到Eureka Server上(默认为true),本次位单机部署,不需要设置为true;但是注册中心集群时候必须为true;因为集群时,需要提供本Eureka Server可发现性;(即是否注册自己的开关)
    register-with-eureka: true
    #表示是否从Eureka Server获取注册信息(默认为true);这是一个单点的 Eureka Server，不需要同步其他节点的数据，可以设为false
    fetch-registry: true
  instance:
    instance-id: ${spring.cloud.client.ip-address}:${server.port}
    prefer-ip-address: true
    ip-address: ${spring.cloud.client.ip-address}
urlPath: http://localhost:18096/${spring.application.name}

monitor:
  ip: http://localhost:18070
camera:
  ip: http://localhost:15946