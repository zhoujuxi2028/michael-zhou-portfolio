# 简单产品状态查询服务配置
# 参考toyou系统配置结构

server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: simple-product-status-query

  # 数据源配置（暂时使用内存数据库进行测试）
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:

  # H2数据库控制台（仅测试环境）
  h2:
    console:
      enabled: true
      path: /h2-console

  # JPA配置
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# 日志配置
logging:
  level:
    com.zct.poc: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%logger{36}:%line] - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%logger{36}:%line] - %msg%n"
  file:
    name: logs/simple-product-status-query.log
    max-size: 10MB
    max-history: 30

# 管理端点配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# 自定义配置
app:
  # 模拟中国电信物联网认证配置
  telecom-iot:
    enabled: true
    app-key: "test_app_key_12345"
    app-secret: "test_app_secret_67890"
    platform-url: "https://api.iot.chinatelecom.com"
    timeout: 5000

  # 产品状态查询配置
  product-status:
    cache-enabled: false
    max-query-size: 100
    default-timeout: 3000