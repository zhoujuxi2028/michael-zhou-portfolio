# AEP Integration 数据库配置文件
# 适用于远程MySQL服务器连接
# 版本: v1.0
# 更新: 2026-01-25

# ==================== 基础连接配置 ====================
# MySQL服务器地址 (支持环境变量覆盖)
DB_HOST=your-mysql-server.com
DB_PORT=3306
DB_NAME=aep_integration

# 认证信息 (建议使用环境变量)
DB_USERNAME=aep_user
DB_PASSWORD=your_secure_password

# ==================== 远程连接优化配置 ====================
# 驱动类
DB_DRIVER_CLASS=com.mysql.cj.jdbc.Driver

# 连接池配置 (针对远程连接优化)
DB_POOL_SIZE=8
DB_MIN_IDLE=2
DB_MAX_IDLE=8

# 连接超时配置 (远程连接需要更长超时时间)
DB_CONNECTION_TIMEOUT=60000
DB_IDLE_TIMEOUT=300000
DB_MAX_LIFETIME=1200000

# 网络超时配置
DB_SOCKET_TIMEOUT=30000
DB_CONNECT_TIMEOUT=10000

# ==================== MySQL远程连接优化 ====================
# 启用SSL连接 (生产环境推荐)
DB_USE_SSL=true
DB_SSL_MODE=REQUIRED
DB_SSL_TRUST_STORE_TYPE=JKS

# 字符集和时区配置
DB_CHARACTER_ENCODING=utf8mb4
DB_USE_UNICODE=true
DB_SERVER_TIMEZONE=Asia/Shanghai

# 性能优化配置
DB_USE_SERVER_PREP_STMTS=true
DB_CACHE_PREP_STMTS=true
DB_PREP_STMT_CACHE_SIZE=250
DB_PREP_STMT_CACHE_SQL_LIMIT=2048
DB_REWRITE_BATCHED_STATEMENTS=true

# 连接验证配置 (远程连接重要)
DB_TEST_ON_BORROW=true
DB_TEST_ON_RETURN=false
DB_TEST_WHILE_IDLE=true
DB_VALIDATION_INTERVAL=30000

# ==================== 高级配置 ====================
# 故障转移配置 (支持多个MySQL主机)
DB_FAILOVER_READ_ONLY=false
DB_AUTO_RECONNECT=true
DB_MAX_RECONNECTS=3

# 负载均衡配置 (如果使用MySQL Cluster)
DB_LOAD_BALANCE_CONNECTION_GROUP=aep-cluster
DB_LOAD_BALANCE_EXCEPTION_CHECKER=com.mysql.cj.jdbc.ha.StandardLoadBalanceExceptionChecker

# 监控和日志配置
DB_LOG_SLOW_QUERIES=true
DB_SLOW_QUERY_THRESHOLD=2000
DB_USE_USAGE_ADVISOR=false
DB_PROFILE_SQL=false

# ==================== 数据库迁移配置 ====================
# 是否启用数据库迁移
DB_ENABLE_MIGRATION=true
DB_MIGRATION_BASELINE_ON_MIGRATE=true
DB_MIGRATION_VALIDATE_ON_MIGRATE=true

# ==================== 生产环境安全配置 ====================
# 连接加密
DB_USE_SSL_STRICT=true
DB_SSL_CERT_PATH=/path/to/client-cert.pem
DB_SSL_KEY_PATH=/path/to/client-key.pem
DB_SSL_CA_PATH=/path/to/ca-cert.pem

# 连接验证
DB_ALLOW_PUBLIC_KEY_RETRIEVAL=false
DB_USE_COMPRESSION=true

# 会话配置
DB_SESSION_VARIABLES=sql_mode='STRICT_TRANS_TABLES,ERROR_FOR_DIVISION_BY_ZERO,NO_AUTO_CREATE_USER,NO_ENGINE_SUBSTITUTION'

# ==================== 开发环境配置 ====================
# 开发环境可以相对宽松的配置
# DB_USE_SSL=false
# DB_ALLOW_PUBLIC_KEY_RETRIEVAL=true
# DB_LOG_SLOW_QUERIES=false

# ==================== 配置说明 ====================
# 1. 生产环境务必启用SSL连接
# 2. 连接池大小根据并发量调整，远程连接建议不超过20
# 3. 超时时间要考虑网络延迟，建议设置较大值
# 4. 启用连接验证以处理网络中断
# 5. 使用环境变量覆盖敏感配置