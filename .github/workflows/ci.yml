name: CI

on:
  pull_request:
    branches: [main]

jobs:
  android-compose:
    name: Unit Tests (android-testing-demo-compose)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - name: Run unit tests
        working-directory: android-testing-demo-compose
        run: ./gradlew test

  android-view:
    name: Unit Tests (android-testing-demo-view)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - name: Run unit tests
        working-directory: android-testing-demo-view
        run: ./gradlew test

  edi:
    name: Tests (edi-reporting-demo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install pytest
        run: pip install pytest
      - name: Run tests
        working-directory: edi-reporting-demo/edi
        run: PYTHONPATH=. pytest tests/ -v

  adas:
    name: Tests (adas-log-toolchain-lab)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: adas-log-toolchain-lab
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: adas-log-toolchain-lab/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run demo
      # test:generated uses --passWithNoTests: fail here if the demo produced no regression cases.
      - run: test -f out/cases/generated/regression.test.ts
      - run: npm run test:generated -- out/cases

  adas-analysis:
    name: Tests (adas-log-toolchain-lab analysis)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: adas-log-toolchain-lab/analysis
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt flake8==7.5.0
      - run: flake8 --max-line-length 100 .
      - run: pytest -v

  adas-analysis-spark:
    name: Tests (adas-log-toolchain-lab analysis, PySpark)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: adas-log-toolchain-lab/analysis
    steps:
      - uses: actions/checkout@v7
      # Spark 4.0 supports Java 17 / 21 only.
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            adas-log-toolchain-lab/analysis/requirements.txt
            adas-log-toolchain-lab/analysis/requirements-spark.txt
      - run: pip install -r requirements-spark.txt
      # The tests use importorskip; fail here instead of skipping if the install is broken.
      - run: python -c "import pyspark; print(pyspark.__version__)"
      - run: pytest -v tests/test_spark_aggregate.py

  adas-dashboard:
    name: Tests (adas-log-toolchain-lab dashboard)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: adas-log-toolchain-lab/dashboard
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: adas-log-toolchain-lab/dashboard/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
