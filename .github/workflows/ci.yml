name: CI

on:
  pull_request:
    branches: [main]

jobs:
  android-compose:
    name: Unit Tests (android-testing-demo-compose)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - name: Run unit tests
        working-directory: android-testing-demo-compose
        run: ./gradlew test

  android-view:
    name: Unit Tests (android-testing-demo-view)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - name: Run unit tests
        working-directory: android-testing-demo-view
        run: ./gradlew test

  edi:
    name: Tests (edi-reporting-demo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install pytest
        run: pip install pytest
      - name: Run tests
        working-directory: edi-reporting-demo/edi
        run: PYTHONPATH=. pytest tests/ -v

  adas:
    name: Tests (adas-log-toolchain-lab)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: adas-log-toolchain-lab
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: adas-log-toolchain-lab/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run demo

  adas-analysis:
    name: Tests (adas-log-toolchain-lab analysis)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: adas-log-toolchain-lab/analysis
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt flake8==7.5.0
      - run: flake8 --max-line-length 100 .
      - run: pytest -v

  adas-dashboard:
    name: Tests (adas-log-toolchain-lab dashboard)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: adas-log-toolchain-lab/dashboard
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: adas-log-toolchain-lab/dashboard/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
