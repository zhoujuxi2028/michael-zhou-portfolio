<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ADAS Log Toolchain Dashboard</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 0; background: #f5f6f8; color: #1d2733; }
      header, main, footer { max-width: 1100px; margin: 0 auto; padding: 12px 20px; }
      h1 { font-size: 1.4rem; margin: 8px 0 0; }
      .meta { color: #5b6773; font-size: 0.85rem; }
      .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
      .card { background: #fff; border-radius: 8px; padding: 12px 14px; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
      .card .label { font-size: 0.8rem; color: #5b6773; }
      .card .value { font-size: 1.6rem; font-weight: 600; }
      .card .hint { font-size: 0.7rem; color: #7a8591; }
      .charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 12px; margin-top: 12px; }
      .chart { background: #fff; border-radius: 8px; height: 340px; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
      .chart.wide { grid-column: 1 / -1; }
      #error { background: #fdecea; border: 1px solid #c0392b; color: #7b1d13; border-radius: 8px; padding: 14px 18px; }
      footer { text-align: center; color: #5b6773; font-size: 0.8rem; }
    </style>
  </head>
  <body>
    <header>
      <h1>ADAS Log Toolchain Dashboard</h1>
      <div id="meta" class="meta"></div>
    </header>
    <main>
      <div id="error" hidden role="alert"></div>
      <section id="content" hidden>
        <div id="cards" class="cards"></div>
        <div class="charts">
          <div id="chart-rule" class="chart"></div>
          <div id="chart-module" class="chart"></div>
          <div id="chart-timeline" class="chart wide"></div>
        </div>
      </section>
    </main>
    <footer>Synthetic data only</footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
