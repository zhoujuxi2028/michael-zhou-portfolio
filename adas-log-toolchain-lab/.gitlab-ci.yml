# Example, not executed on GitLab. Mirrors the GitHub Actions `adas` job; assumes this directory is the repo root.
image: node:22

stages:
  - lint
  - test

variables:
  npm_config_cache: "$CI_PROJECT_DIR/.npm"

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

default:
  before_script:
    - npm ci

lint:
  stage: lint
  script:
    - npm run lint
    - npm run typecheck

test:
  stage: test
  script:
    - npm run test:coverage
    - npm run demo
  coverage: '/Lines\s*:\s*(\d+\.?\d*)%/'
  artifacts:
    when: always
    paths:
      - coverage/
